<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* Layout: map on top, one sheet below — "Where are you?", a week/fortnight/month switch, a route button, then the homes nearby */
:root{
  --sheet:#f9f9fb; --card:#fff; --glass:rgba(255,255,255,.85);
  --fg:#000; --fg2:rgba(60,60,67,.62); --fg3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --blue:#0066e6; --green:#28b04c; --red:#ff3b30;
  --water:#aad3ee; --land:#f5f3ee; --land2:#efece5; --border:rgba(130,120,100,.22); --label:rgba(80,74,64,.62);
  --road:#ffffff; --roadEdge:rgba(120,110,95,.28); --hwy:#ffd879; --hwyEdge:#e3b04b; --roadLabel:#55524c;
  --shadow:0 4px 18px rgba(0,0,0,.13),0 0 0 .5px rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sheet:#1c1c1e; --card:#2c2c2e; --glass:rgba(44,44,46,.82);
  --fg:#fff; --fg2:rgba(235,235,245,.6); --fg3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a;
  --water:#0f2338; --land:#1e1f22; --land2:#232428; --border:rgba(255,255,255,.07); --label:rgba(235,235,245,.38);
  --road:#3b3c41; --roadEdge:rgba(0,0,0,.45); --hwy:#7d6527; --hwyEdge:#5a481b; --roadLabel:rgba(235,235,245,.62);
  --shadow:0 4px 18px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --sheet:#1c1c1e; --card:#2c2c2e; --glass:rgba(44,44,46,.82);
  --fg:#fff; --fg2:rgba(235,235,245,.6); --fg3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --blue:#0a84ff; --green:#30d158; --red:#ff453a;
  --water:#0f2338; --land:#1e1f22; --land2:#232428; --border:rgba(255,255,255,.07); --label:rgba(235,235,245,.38);
  --road:#3b3c41; --roadEdge:rgba(0,0,0,.45); --hwy:#7d6527; --hwyEdge:#5a481b; --roadLabel:rgba(235,235,245,.62);
  --shadow:0 4px 18px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.06); color-scheme:dark}
*{box-sizing:border-box}
html,body{position:fixed;top:0;left:0;right:0;height:var(--apph,100%);margin:0;padding:0!important;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
html,body{background:#f8f4f0}@media (prefers-color-scheme:dark){html,body{background:#1c1c1e}}
body{color:var(--fg);font-family:var(--font);font-size:17px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,a,input{font:inherit;color:inherit;touch-action:manipulation}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.app{position:fixed;top:0;left:0;right:0;height:var(--apph,100%);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%}
.legal{position:absolute;left:14px;bottom:calc(100% + 8px);font-size:11px;font-weight:500;color:var(--fg2);text-decoration:underline;text-underline-offset:2px;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}

.stop-pin{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4);display:grid;place-items:center;font:800 13px/1 var(--rounded);cursor:pointer}
.stop-pin.sel{width:34px;height:34px;font-size:15px}
.stop-pin.next{width:22px;height:22px;background:#fff;color:var(--blue);border:2px solid var(--blue);font-size:10px}
.stop-pin.next.sel{width:32px;height:32px;font-size:13px}
.hq-pin{padding:3px 6px;border-radius:6px;background:var(--fg);color:var(--card);font:800 10px var(--rounded);box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:default}
.me-dot{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4);display:grid;place-items:center;position:relative}
.me-dot i{width:15px;height:15px;border-radius:50%;background:var(--blue)}
.me-dot.live::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:var(--blue);opacity:.25;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.4);opacity:.45}to{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.me-dot.live::before{animation:none}}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--shadow)}
.scrim{position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 18px);z-index:4;pointer-events:none;background:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,0))}
.statsfab{position:absolute;right:12px;top:calc(158px + env(safe-area-inset-top,0px));z-index:5;width:44px;padding:7px 0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--blue);font:600 10px var(--font)}
.statsfab[hidden]{display:none}.statsfab svg{width:20px;height:20px}
.sheet.mini .seg,.sheet.mini .summary,.sheet.mini .go,.sheet.mini .scroll,.sheet.mini #vDetail{visibility:hidden}
.overlay{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.panel{width:100%;max-width:520px;max-height:90%;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:860px){.overlay{align-items:center}.panel{border-radius:16px}}
.ptop{display:flex;align-items:center;justify-content:space-between}
.ptop h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.025em}
.sblock{display:flex;flex-direction:column;gap:8px}
.sblock h3{margin:6px 4px 0;font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big div{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.big b{display:block;font:700 32px/1 var(--rounded);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big span{font-size:14px;line-height:1.3;color:var(--fg2)}
.bars{background:var(--card);border-radius:12px;padding:2px 16px}
.bar{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;align-items:center;gap:12px;min-height:46px;padding:10px 0;font-size:16px}
.bar+.bar{border-top:.5px solid var(--sep)}
.bar em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{display:block;height:10px;border-radius:5px;background:var(--blue);min-width:6px}
.bar .track{background:var(--fill);border-radius:5px;overflow:hidden}
.bar b{text-align:right;min-width:28px;font-weight:600;font-variant-numeric:tabular-nums}
.days{background:var(--card);border-radius:12px;padding:16px 12px 12px;display:flex;align-items:flex-end;gap:6px;height:170px}
.days div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--fg2)}
.days i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--blue);min-height:2px}
.days b{font-size:12px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.days i{max-width:28px}
.nameIn{height:48px;border-radius:12px;border:0;background:var(--fill);padding:0 14px;font-size:17px;color:var(--fg);outline:none}
.mbtns{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;border-radius:12px;overflow:hidden}
.mbtns button{width:44px;height:44px;display:grid;place-items:center;color:var(--blue)}
.mbtns button+button{border-top:.5px solid var(--sep)}
.mbtns svg{width:20px;height:20px}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;height:var(--sh,55%);display:flex;flex-direction:column;
  background:var(--sheet);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--sep),0 -8px 30px rgba(0,0,0,.12);transition:height .38s cubic-bezier(.25,1,.3,1);padding-bottom:max(0px,calc(env(safe-area-inset-bottom,0px) - var(--gap,0px)))}
.sheet.drag{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;touch-action:none;cursor:ns-resize}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--fg3)}
.view{display:flex;flex-direction:column;min-height:0;flex:1}
.view[hidden]{display:none}
.head{flex:none;padding:0 16px 12px;display:flex;flex-direction:column;gap:12px;position:relative;touch-action:none}
.head input,.head .seg,.head .go{touch-action:manipulation}

.where{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:12px;background:var(--fill)}
.where svg{flex:none;width:17px;height:17px;color:var(--fg2)}
.where input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;color:var(--fg)}
.where input::placeholder{color:var(--fg2)}
.gps{flex:none;height:32px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:5px;color:var(--blue);font-size:14px;font-weight:600}
.gps svg{width:15px;height:15px;color:var(--blue)}
.gps.on{background:var(--blue);color:#fff}.gps.on svg{color:#fff}
.sugg{position:absolute;left:16px;right:16px;top:48px;z-index:3;background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sugg button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:12px 14px;text-align:left}
.sugg button+button{border-top:.5px solid var(--sep)}
.sugg span{color:var(--fg2);font-size:14px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:7px 0;border-radius:7px;font-size:14px;font-weight:600;color:var(--fg2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.summary{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.summary h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary button{flex:none;font-size:15px;color:var(--blue);font-weight:500}
.go{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;text-decoration:none;transition:transform .12s,opacity .2s}
.go:active{transform:scale(.98);opacity:.85}
.go svg{width:18px;height:18px}
.go small{font-weight:500;opacity:.85}
.go[aria-disabled="true"]{background:var(--fill2);color:var(--fg3);pointer-events:none}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 28px;overscroll-behavior:contain}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:58px;border-top:.5px solid var(--sep)}
.row:active{background:var(--fill)}
.num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 14px var(--rounded)}
.row.done .num{background:var(--green)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.rt span{display:block;font-size:14px;color:var(--fg2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .rt b{color:var(--fg2)}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--fg3);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.tick svg{width:15px;height:15px}
.row.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.cap{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px}
.empty{text-align:center;padding:28px 20px;color:var(--fg2);font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.foot{text-align:center;font-size:12px;color:var(--fg3);margin-top:16px}

.dtop{display:flex;align-items:flex-start;gap:12px}
.close{flex:none;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--fg2);display:grid;place-items:center}
.close svg{width:12px;height:12px}
.dtop h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.dtop p{margin:3px 0 0;font-size:15px;color:var(--fg2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border-radius:12px;background:var(--fill);color:var(--blue);font-size:16px;font-weight:600;text-decoration:none}
.act svg{width:19px;height:19px}
.act.prim{background:var(--blue);color:#fff}
.act.ok{background:var(--green);color:#fff}
.facts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:12px;overflow:hidden}
.fact{padding:11px 12px}
.fact+.fact{border-left:.5px solid var(--sep)}
.fact span{display:block;font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:.02em}
.fact b{display:block;font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.links{background:var(--card);border-radius:12px;overflow:hidden;margin-top:12px}
.link{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:var(--fg);position:relative}
.link+.link::before{content:"";position:absolute;top:0;right:0;left:56px;border-top:.5px solid var(--sep)}
.link i{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 11px var(--rounded);font-style:normal}
.link .t{flex:1}
.link svg{flex:none;width:14px;height:14px;color:var(--fg3)}

.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.85);z-index:20;min-width:140px;padding:22px 20px 18px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.3,1.4,.5,1)}
.toast svg{width:50px;height:50px}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:859px){.sheet{left:10px;right:10px;bottom:10px;border-radius:26px;padding-bottom:0!important;box-shadow:0 6px 30px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.06)}.sheet .scroll{border-radius:0 0 26px 26px}}
@media (min-width:860px){
  .sheet{left:12px;right:auto;bottom:12px;top:56px;width:390px;height:auto!important;border-radius:14px;box-shadow:var(--shadow)}
  .grab{height:12px}.grab i{display:none}
  .sheet::after{display:none}.legal{bottom:auto;top:calc(100% + 8px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    rows=all.filter(x=>x.t>=w0&&x.t<w1);

    const end=new Date(w1-864e5);title=`${d.getDate()} ${MON[d.getMonth()]} – ${end.getDate()} ${MON[end.getMonth()]}`;label="this week";

  const people=by("n"),subs=by("s").slice(0,8),mx=Math.max(1,...cols.map(c=>c[1])),pm=Math.max(1,...people.map(p=>p[1])),sm=Math.max(1,...subs.map(p=>p[1]));
  const bars=(list,max)=>list.length?`<div class="bars">${list.map(([k,v])=>`<div class="bar"><em>${esc(k)}</em><span class="track"><i style="width:${Math.max(4,v/max*100)}%"></i></span><b>${v}</b></div>`).join("")}</div>`:`<div class="bars"><div class="empty" style="padding:16px 0">No drops ${label}</div></div>`;
  $("statsBody").innerHTML=`<div class="big"><div><b>${rows.length}</b><span>flyers dropped ${label}</span></div><div><b>${people.length}</b><span>people dropping</span></div></div>
    <section class="sblock"><h3>${title}</h3><div class="days">${cols.map(([l,v,cur])=>`<div>${v?`<b>${v}</b>`:""}<i style="height:${v/mx*78}%;${cur?"":"opacity:.55"}"></i><span style="${cur?"color:var(--fg);font-weight:700":""}">${l}</span></div>`).join("")}</div></section>
    <section class="sblock"><h3>By person</h3>${bars(people,pm)}</section>
    <section class="sblock"><h3>Top suburbs</h3>${bars(subs,sm)}</section>
    ${myName?`<button class="more" id="renameBtn">You're dropping as ${esc(myName)} · change</button>`:""}`;
}

/* ---------- Where ---------- */
const here=()=>gps||S.loc||HQ;
function setLoc(name){const c=SUB[name.toUpperCase()];if(!c)return false;S.loc={name,lat:c[0],lng:c[1]};store.set("dr4-loc",S.loc);stopGPS();

function startGPS(){if(!navigator.geolocation)return failGPS();$("gpsTxt").textContent="…";
  const t=setTimeout(failGPS,7000);
  try{watchId=navigator.geolocation.watchPosition(p=>{clearTimeout(t);const first=!gps;gps={name:"Your location",lat:p.coords.latitude,lng:p.coords.longitude,live:true};
      if(first){render();fit()}else if(!render.last||km(render.last,gps)>.15)render();else draw()},()=>{clearTimeout(t);failGPS()},{enableHighAccuracy:true,maximumAge:10000,timeout:15000})}catch(e){clearTimeout(t);failGPS()}}

  const o=here();$("sugg").innerHTML=m.map(n=>{const c=SUB[n.toUpperCase()],cnt=pool().filter(h=>km({lat:c[0],lng:c[1]},h)<=S.rad).length;

/* ---------- Route (background) ---------- */
function pool(){const cut=daysAgo(S.days);return homes.filter(h=>h.date>=cut)}
function nearby(){const o=here();return pool().filter(h=>km(o,h)<=S.rad)}
function plan(start,pts){if(!pts.length)return[];let left=pts.slice(),out=[],cur=start;
  while(left.length){let bi=0,bd=1e9;left.forEach((p,i)=>{const d=km(cur,p);if(d<bd){bd=d;bi=i}});cur=left.splice(bi,1)[0];out.push(cur)}

    if(km(a,c)+(d?km(b,d):0)+1e-9<km(a,b)+(d?km(c,d):0)){p.splice(i,k-i+1,...p.slice(i,k+1).reverse());imp=true}}}
  return p.slice(1)}
function goUrl(stops){const s=stops.slice(0,10),dest=s[s.length-1],w=s.slice(0,-1);
  let u=`https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${addrQ(dest)}`;if(w.length)u+=`&waypoints=${w.map(addrQ).join("%7C")}`;return u}

/* ---------- Map (MapLibre + OpenFreeMap street map) ---------- */
const STYLE_LIGHT="https://tiles.openfreemap.org/styles/liberty",STYLE_DARK="https://tiles.openfreemap.org/styles/dark";
const darkQ=matchMedia("(prefers-color-scheme: dark)");

const EMPTY={type:"FeatureCollection",features:[]};

const fc=list=>({type:"FeatureCollection",features:list});
const pt=(h,props)=>({type:"Feature",geometry:{type:"Point",coordinates:[h.lng,h.lat]},properties:props});
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

}
function sheetPad(){const wide=innerWidth>=860,t=$("app").querySelector(".mbtns").getBoundingClientRect().top;return{top:t+12,left:wide?410:30,right:30,bottom:wide?30:Math.min($("sheet").offsetHeight+20,innerHeight*.6)}}

$("statsClose").onclick=()=>{$("stats").hidden=true};
$("stats").addEventListener("click",e=>{if(e.target.id==="stats")$("stats").hidden=true;const b=e.target.closest("[data-p]");if(b){statsP=b.dataset.p;renderStats()}if(e.target.closest("#renameBtn"))askName().then(renderStats)});
$("zIn").onclick=()=>map&&map.zoomIn();$("zOut").onclick=()=>map&&map.zoomOut();
$("scroll").addEventListener("click",e=>{const t=e.target.closest("[data-tick]");if(t){e.stopPropagation();toggleDrop(t.dataset.tick);return}const r=e.target.closest(".row");if(r)openDetail(r.dataset.id)});
$("scroll").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("row")){e.preventDefault();openDetail(e.target.dataset.id)}});
addEventListener("resize",()=>{setSnap(snapI,false)});

setSnap(1,false);setTimeout(()=>setSnap(snapI,false),400);initMap();loadSales();connectDrops();startGPS();
</script>
</body></html>
